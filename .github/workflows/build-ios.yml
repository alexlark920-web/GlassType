name: Build iOS keyboard

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - App/**
      - Keyboard/**
      - Shared/**
      - Core/**
      - GlassType.xcodeproj/**
      - Docs/**
      - Scripts/**
      - README.md
      - LICENSE
      - .github/workflows/build-ios.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: |
          ls -d /Applications/Xcode*.app
          xcodebuild -version
          xcodebuild -showsdks

      - name: Validate project structure
        run: python3 Scripts/validate_project.py

      - name: Run tests and simulator build
        run: bash Scripts/check-macos.sh

      - name: Build unsigned IPA
        run: bash Scripts/make-unsigned-ipa.sh

      - name: Read product version
        id: release
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import plistlib
          with open("App/Info.plist", "rb") as source:
              info = plistlib.load(source)
          print(f"version={info['CFBundleShortVersionString']}")
          print(f"build={info['CFBundleVersion']}")
          PY

      - name: Package versioned sources
        run: python3 Scripts/package_source.py

      - name: Save IPA for download
        uses: actions/upload-artifact@v4
        with:
          name: GlassType-unsigned-IPA
          path: build/GlassType-unsigned.ipa
          if-no-files-found: error
          retention-days: 7

      - name: Save versioned sources
        uses: actions/upload-artifact@v4
        with:
          name: GlassType-source-v${{ steps.release.outputs.version }}-build${{ steps.release.outputs.build }}
          path: build/GlassType-source-v${{ steps.release.outputs.version }}-build${{ steps.release.outputs.build }}.zip
          if-no-files-found: error
          retention-days: 30
