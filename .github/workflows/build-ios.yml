name: Build iOS keyboard

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - GlassType-1.1-update.zip
      - .github/workflows/build-ios.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Apply update
        run: unzip -o GlassType-1.1-update.zip

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Validate project structure
        run: python3 Scripts/validate_project.py

      - name: Run tests and simulator build
        run: bash Scripts/check-macos.sh

      - name: Build unsigned IPA
        run: bash Scripts/make-unsigned-ipa.sh

      - name: Save IPA for download
        uses: actions/upload-artifact@v4
        with:
          name: GlassType-unsigned-IPA
          path: build/GlassType-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
